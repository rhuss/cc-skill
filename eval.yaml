name: cc-skill-checker
description: Evaluate the skill:check command that assesses SKILL.md files against 14 authoring patterns
skill: skill:check

execution:
  mode: case
  arguments: "{skill_path}"
  timeout: 300

runner:
  type: claude-code
  plugin_dirs:
    - skill

models:
  skill: claude-opus-4-6
  judge: claude-opus-4-6

permissions:
  allow:
    - "Skill"
  deny: []

mlflow:
  experiment: cc-skill-checker-eval

dataset:
  path: eval/cases
  # How many targeted test cases to generate per enhanced pattern during /skill:measure (1-2)
  targeted_cases_per_pattern: 1
  schema: |
    Each case directory contains:
    - input.yaml: YAML file with 'skill_path' (path to the SKILL.md file
      to evaluate, relative to the workspace root). The SKILL.md file itself
      must be present in the case directory or workspace.
    - skill.md: The actual SKILL.md file to be evaluated. Copied into the
      workspace at the path specified by 'skill_path' before execution.
    - annotations.yaml: Expected evaluation metadata including:
      - 'expected_strong' (list of pattern names expected to rate 'strong')
      - 'expected_absent' (list of pattern names expected to rate 'absent')
      - 'expected_na' (list of pattern names expected to rate 'N/A')
      - 'min_patterns_present' (minimum number of patterns rated present or strong)
      - 'description' (human-readable description of what this test case exercises)

outputs:
  - path: output
    schema: |
      The checker skill produces stdout-only output (no files written to disk).
      The output is a markdown report containing:
      - A "Pattern Checklist" table with columns: #, Pattern, Category, Status, Notes
        where Status is one of: strong, present, absent, N/A
      - A Summary line: "X of Y applicable patterns present, Z of Y strong, W improvements suggested"
      - An "Activation Test" section with trigger/non-trigger scenarios and observations
      - Optionally a "Prompt Pattern Analysis" section if the prompt plugin is loaded
      Judges should read outputs["conversation"] for the full assessment text.

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  - name: pattern_table_present
    description: |
      Checks that the output contains a properly formatted pattern checklist
      table with all 14 patterns evaluated.
    check: |
      import re
      text = outputs.get("conversation", "")
      if not text:
          return (False, "No conversation output")
      if "Pattern Checklist" not in text and "Pattern" not in text:
          return (False, "No pattern checklist found")
      rows = re.findall(r'\|\s*\d+\s*\|', text)
      if len(rows) < 14:
          return (False, f"Only {len(rows)} pattern rows found, expected 14")
      return (True, f"All 14 pattern rows present")

  - name: valid_statuses
    description: |
      Checks that every pattern row uses a valid status value
      (strong, present, absent, or N/A).
    check: |
      import re
      text = outputs.get("conversation", "")
      if not text:
          return (False, "No conversation output")
      valid = {"strong", "present", "absent", "n/a"}
      rows = re.findall(r'\|\s*\d+\s*\|[^|]+\|[^|]+\|\s*(\S+)\s*\|', text)
      if not rows:
          return (False, "Could not parse status values from table")
      invalid = [s for s in rows if s.lower() not in valid]
      if invalid:
          return (False, f"Invalid statuses: {invalid}")
      return (True, f"{len(rows)} statuses all valid")

  - name: summary_line_present
    description: |
      Checks that the summary line with pattern counts is present
      and has valid arithmetic.
    check: |
      import re
      text = outputs.get("conversation", "")
      if not text:
          return (False, "No conversation output")
      match = re.search(r'(\d+)\s+of\s+(\d+)\s+applicable.*?(\d+)\s+of\s+\d+\s+strong.*?(\d+)\s+improvement', text)
      if not match:
          return (False, "Summary line not found or malformed")
      present, total, strong, improvements = int(match.group(1)), int(match.group(2)), int(match.group(3)), int(match.group(4))
      if present > total:
          return (False, f"Present ({present}) > total ({total})")
      if strong > present:
          return (False, f"Strong ({strong}) > present ({present})")
      return (True, f"{present}/{total} present, {strong} strong, {improvements} improvements")

  - name: activation_test_present
    description: |
      Checks that the activation test section exists with trigger
      and non-trigger scenarios.
    check: |
      text = outputs.get("conversation", "")
      if not text:
          return (False, "No conversation output")
      has_activation = "Activation Test" in text
      has_trigger = "trigger" in text.lower() or "Would trigger" in text
      has_non_trigger = "NOT trigger" in text or "Should NOT" in text
      if not has_activation:
          return (False, "Activation Test section missing")
      if not has_trigger:
          return (False, "No trigger scenarios found")
      if not has_non_trigger:
          return (False, "No non-trigger scenarios found")
      return (True, "Activation test with trigger and non-trigger scenarios")

  - name: assessment_quality
    description: |
      LLM judge that evaluates the overall quality and accuracy of the
      skill assessment, checking that notes are specific and actionable.
    prompt: |
      You are evaluating the output of a skill assessment tool. The tool
      analyzes SKILL.md files against 14 skill-authoring patterns and produces
      a checklist with quality ratings.

      Here is the assessment output:

      {{ conversation }}

      {{ annotations }}

      Evaluate on a 1-5 scale:

      Score 1: Assessment is missing most patterns, notes are generic
        ("looks good"), statuses seem random or unjustified.
      Score 2: Assessment covers patterns but notes lack specificity.
        Most notes describe the pattern definition rather than the
        skill's application of it.
      Score 3: Assessment is complete with all patterns. Notes reference
        specific elements from the skill but some are still vague.
        Summary arithmetic is correct.
      Score 4: Assessment is thorough. Notes are specific and actionable,
        referencing concrete sections, phrases, or missing elements.
        Status classifications (strong vs present) are well-justified.
        Activation test scenarios are realistic.
      Score 5: Assessment is expert-level. Every note pinpoints exactly
        what makes a pattern strong, present, or absent with specific
        evidence. Edge cases in classification (present vs strong) are
        handled with clear reasoning. Non-trigger scenarios test
        genuine boundary conditions.

thresholds:
  pattern_table_present:
    min_pass_rate: 1.0
  valid_statuses:
    min_pass_rate: 1.0
  summary_line_present:
    min_pass_rate: 1.0
  activation_test_present:
    min_pass_rate: 1.0
  assessment_quality:
    min_mean: 3.5
