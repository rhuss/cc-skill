        the last 5,000 lines of large files is practical and well-reasoned; the filled
        example with ConnectionTimeout/NullPointerException data is realistic and
        anchors output quality. Exclusion clauses are specific and meaningful (real-time
        streaming, metrics aggregation, structured JSON querying are genuine misroute
