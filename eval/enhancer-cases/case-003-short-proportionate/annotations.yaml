description: >
  A tiny 20-line word counter skill. Tests that the enhancer stays
  proportionate and doesn't bloat a simple utility into a specification.
  The proportionate_enhancement judge will fail if the result exceeds
  3x the original size (60 lines).
expected_absent_patterns:
  - Exclusion Clause
  - Explain-the-Why
  - Known Gotchas
expected_improvements: 2
skill_line_count: 20
