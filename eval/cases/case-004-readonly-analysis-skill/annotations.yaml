description: >
  A read-only code complexity analyzer. Several workflow patterns (Self-Correcting
  Loop, Plan-Validate-Execute) should be N/A since the skill never modifies files
  or creates artifacts that need validation. Tests that the checker correctly
  applies N/A for inapplicable conditional patterns rather than marking them absent.
expected_strong:
  - Activation Metadata
  - Template Scaffold
expected_absent:
  - Exclusion Clause
  - Known Gotchas
  - In-Skill Examples
expected_na:
  - Self-Correcting Loop
  - Plan-Validate-Execute
  - Utility Bundle
min_patterns_present: 7
